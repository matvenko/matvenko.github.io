<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boo took a wrong turn — Maze Boo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      color: #fff; text-align: center; font: 400 1.1rem/1.6 "Nunito", system-ui, sans-serif;
      background: radial-gradient(800px 500px at 50% 20%, rgba(130, 100, 255, .45), transparent 70%),
        linear-gradient(180deg, #1a1252, #2a1f6e 60%, #3a2b93);
    }
    main { max-width: 520px; }
    img.logo { width: min(320px, 80%); height: auto; margin: 0 auto 28px; display: block; }
    .code { font: 700 clamp(4rem, 18vw, 8rem)/1 "Fredoka", sans-serif; color: #ffcf3f; text-shadow: 0 6px 0 #c4780a; }
    h1 { font: 600 1.8rem "Fredoka", sans-serif; margin: 16px 0 8px; }
    p { margin: 0 0 28px; color: rgba(255, 255, 255, .8); }
    a.btn {
      display: inline-block; padding: 14px 26px; border-radius: 999px; background: #ffcf3f; color: #1f1657;
      font: 600 1.1rem "Fredoka", sans-serif; text-decoration: none; box-shadow: 0 4px 0 #e89a0c;
    }
  </style>
</head>
<body>
  <main>
    <a href="/"><img class="logo" src="/assets/img/logo.webp" alt="Maze Boo" width="1200" height="250"></a>
    <div class="code">404</div>
    <h1>Boo took a wrong turn</h1>
    <p>This corridor is a dead end. The way out is just one step away.</p>
    <a class="btn" href="/">Back to the maze</a>
  </main>
</body>
</html>
